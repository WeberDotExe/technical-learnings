<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>socket io connection test</title>
</head>
<body>
    <h1>Socket.io broadcast test</h1>

    <p id="status">Connecting...</p>
    <p id="socket-id">socket:id not connected</p>

    <hr />

    <h2>Direct server response</h2>
    
    <button id="send-button" disabled>Send Hello event</button>
    <p id="result">no event sent yet</p>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const status = document.getElementById('status');
        const socketId = document.getElementById('socket-id');
        const sendButton = document.getElementById('send-button');
        const result = document.getElementById('result');

        socket.on('connect',()=>{
            status.textContent = 'Connected to socket io server';
            socketId.textContent = `socket:id ${socket.id}`;
            sendButton.disabled = false;
        });

        socket.on("disconnect",(reason)=>{
            status.textContent = `Disconnected ${reason}`;
            socketId.textContent = `socket:id not connected`;
            sendButton.disabled = true;
        })

        socket.on("hello response",(data)=>{
            result.textContent = `server replied :${data.message} | Your message: ${data.recievedMessage}`;
        })

        sendButton.addEventListener("click",()=>{
            socket.emit("hello",{
                message:"Hello from browser",
                sentAt: new Date().toISOString()
            })
            result.textContent = "Hello event sent to server";
        })
    </script>>
</body>
</html>
