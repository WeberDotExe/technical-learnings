<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>socketio lifecycle test</title>
</head>
<body>
    <h1>Socket.io Connection lifecycle</h1>

    <p id="status">Connecting...</p>
    <p id="socket-id">Socket ID: Not connected</p>

   <hr />

   <label for="answer">Your answer</label>
    <input id="answer" type="text" placeholder="type a test answer" />

    <button id="send-button" disabled>Send Answer</button>

    <h2>result</h2>
    <p id="result">waiting for you to send an answer</p>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const status = document.getElementById('status');
        const socketId = document.getElementById('socket-id');
        const answerInput = document.getElementById("answer");
        const sendButton = document.getElementById("send-button");
        const result = document.getElementById("result")
       

        socket.on("connect",()=>{
            status.textContent = "connected";
            socketId.textContent = `Socket ID: ${socket.id}`;
           sendButton.disabled = false;
        })

        socket.on("disconnect",(reason)=>{
            status.textContent = `disconnected ${reason}`;
            socketId.textContent = "Socket ID: Not connected";
            sendButton.disabled = true;
        })

       sendButton.addEventListener("click",()=>{
        const answer = answerInput.value.trim()

        if(!answer){
            result.textContent = "please enter an answer first"
            return;
        }
        result.textContent = "waiting for server acknowledgement..."
        sendButton.disabled = true;

        socket.timeout(3000).emit("save-answer",{answer},(error,response)=>{
            sendButton.disabled = false;

            if(error){
                result.textContent = "the server did not acknowledge the event within three seconds";
                return
            }

            result.textContent = `Success:${response.success} |` + `Server:${response.message} |`+`recieved answer ${response.recievedAnswer}`

        })

       })


    </script>
</body>
</html>
